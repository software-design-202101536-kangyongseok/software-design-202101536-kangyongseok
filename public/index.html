<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h2>My Info</h2>
  <form action="/students" method="get">
    <label for="searchName">Your Name:</label>
    <input type="text" id="searchName" name="name" required>
    <input type="submit" value="Search">
  </form>
  <br><br>
  <h2>Register Student</h2>
  <form action="/students" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required><br><br>
    <label for="age">Age:</label>
    <input type="number" id="age" name="age" required><br><br>
    <label for="subject1">Subject 1:</label>
    <input type="text" id="subject1" name="subject[]" required><br><br>
    <label for="subject2">Subject 2:</label>
    <input type="text" id="subject2" name="subject[]" required><br><br>
    <label for="subject3">Subject 3:</label>
    <input type="text" id="subject3" name="subject[]" required><br><br>
    <label for="bio">Bio:</label>
    <textarea id="bio" name="bio" required></textarea><br><br>
    <input type="submit" value="Submit">
  </form>
</body>
</html>
