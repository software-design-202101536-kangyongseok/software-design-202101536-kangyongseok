name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root dependencies
        run: npm install
      - name: Install frontend dependencies
        run: npm install --prefix client
      - name: Install backend dependencies
        run: npm install --prefix server
      - name: Run backend coverage tests
        run: npm run coverage:backend
        continue-on-error: true
      - name: Run frontend coverage tests
        run: npm run coverage:frontend
        continue-on-error: true
      - name: Check coverage files
        run: |
          echo "Backend coverage:"
          ls -la server/coverage/ 2>/dev/null || echo "No backend coverage"
          echo "Frontend coverage:"
          ls -la client/coverage/ 2>/dev/null || echo "No frontend coverage"
        continue-on-error: true
      - name: Remove lcov-report HTML directories
        run: |
          find . -type d -name "lcov-report" -exec rm -rf {} + 2>/dev/null || true
          echo "All lcov-report directories removed"
        continue-on-error: true
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.sources=client/src,server
            -Dsonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/*.html,**/*.css
            -Dsonar.coverage.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: sonarqube
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm install --prefix client
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npm install -g vercel
          cd client
          vercel --prod --token $VERCEL_TOKEN

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: sonarqube
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -X POST $RENDER_DEPLOY_HOOK