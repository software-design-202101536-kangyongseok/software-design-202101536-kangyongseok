services:
  frontend:
    build: 
      context: ./client
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

  backend:
    build: 
      context: ./server
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URL=${MONGODB_URL}
    depends_on:
      - mongo
    restart: always


#DB
  mongo:
    image: mongo:latest
    container_name: mongo-container
    ports:
      - "27017:27017"
    volumes:
      - mongotutorial-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${ROOT_PASSWORD}
    restart: always
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-container
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${ADMIN_USERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${ADMIN_PASSWORD}
      - ME_CONFIG_BASICAUTH_USERNAME=${BASICAUTH_USERNAME}
      - ME_CONFIG_BASICAUTH_PASSWORD=${BASICAUTH_PASSWORD}
    restart: always

volumes:
  mongotutorial-data:
    driver: local